services:
  - type: web
    name: savelivo-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: CORS_ORIGINS
        value: https://super-selkie-f65d2d.netlify.app
      - key: ALLOWED_MEDIA_HOSTS
        value: super-selkie-f65d2d.netlify.app
      - key: DOWNLOAD_TOKEN_SECRET
        generateValue: true
      - key: ENABLE_PUBLIC_EXTRACTORS
        value: "false"
      - key: SAVELIVO_TEST_KEY
        sync: false  # Render dashboard: set a unique secret of at least 24 characters, do not commit it.
